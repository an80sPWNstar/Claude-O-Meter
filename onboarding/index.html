<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Claude-O-Meter</title>
  <style>
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html,body { width:100%; height:100%; overflow:hidden; background:#141517;
      font-family:system-ui,-apple-system,'Segoe UI',sans-serif; color:#e8e6e3; font-size:13px; }
    input,button { font-family:inherit; outline:none; }

    .win { width:100%; height:100%; display:flex; flex-direction:column;
      background:#141517; border:1px solid #2c2f33; overflow:hidden; }

    .body { flex:1; padding:22px; overflow-y:auto; display:flex; flex-direction:column; gap:18px; }
    .heading { font-size:18px; font-weight:600; color:#e8e6e3; line-height:1.35; }
    .intro { font-size:13px; color:#9aa0a6; line-height:1.55; }

    .cards { display:flex; flex-direction:column; gap:10px; }
    .card { display:flex; gap:12px; padding:12px; border:1px solid #2c2f33; border-radius:8px;
      background:#1b1d20; cursor:pointer; transition:border-color 0.15s; }
    .card:hover { border-color:#3a3e43; }
    .card.selected { border-color:#D97757; }
    .card input[type=radio] { width:15px; height:15px; margin-top:1px; accent-color:#D97757;
      cursor:pointer; flex-shrink:0; }
    .card-body { display:flex; flex-direction:column; gap:4px; }
    .card-title { font-size:15px; font-weight:600; color:#e8e6e3; }
    .card-text { font-size:13px; color:#9aa0a6; line-height:1.5; }

    .manual-row { display:flex; align-items:center; gap:8px; }
    .manual-row.hidden { display:none; }
    .manual-row input[type=text] { flex:1; background:#141517; color:#e8e6e3; border:1px solid #2c2f33;
      border-radius:6px; padding:6px 9px; font-size:13px; }
    .manual-row input[type=text]:focus { border-color:#D97757; }
    .manual-row input[type=text]::placeholder { color:#5a5f64; }
    .browse-btn { background:#1b1d20; border:1px solid #2c2f33; border-radius:6px; padding:6px 12px;
      color:#e8e6e3; font-size:13px; cursor:pointer; white-space:nowrap; }
    .browse-btn:hover { border-color:#D97757; }

    .footer { display:flex; justify-content:flex-end; padding-top:2px; }
    .primary { background:#D97757; border:1px solid #D97757; border-radius:7px; padding:8px 18px;
      color:#141517; font-size:13px; font-weight:600; cursor:pointer; }
    .primary:hover { background:#e08a6c; }
    .primary:disabled { background:#2c2f33; border-color:#2c2f33; color:#5a5f64; cursor:default; }
  </style>
</head>
<body>
<div class="win">
  <div class="body">
    <h1 class="heading">How should Claude-O-Meter reach your account?</h1>
    <p class="intro">The app has not read anything yet, and it will only do what you pick here. You can change this choice later in Settings.</p>

    <div class="cards">
      <label class="card" id="card-auto">
        <input type="radio" name="access" value="auto" checked>
        <span class="card-body">
          <span class="card-title">Find it automatically</span>
          <span class="card-text">Checks the usual places Claude Code keeps its saved login: the .claude folder in the home directory, a folder named by CLAUDE_CONFIG_DIR, the standard app-data folders, and on macOS the login keychain. If none of those has anything, and only then, it also looks at running WSL distributions. It reads credential files only; nothing is sent anywhere except the usage request to Anthropic.</span>
        </span>
      </label>

      <label class="card" id="card-manual">
        <input type="radio" name="access" value="manual">
        <span class="card-body">
          <span class="card-title">Point me at the file</span>
          <span class="card-text">The app reads one file that you name, and nothing else.</span>
        </span>
      </label>

      <label class="card" id="card-browser">
        <input type="radio" name="access" value="browser">
        <span class="card-body">
          <span class="card-title">Sign in through claude.ai</span>
          <span class="card-text">No files are read at all. A sign-in window opens and the session cookie is stored, encrypted, by the app.</span>
        </span>
      </label>
    </div>

    <div class="manual-row hidden" id="manual-row">
      <input type="text" id="manual-path" readonly placeholder="No file chosen">
      <button class="browse-btn" id="browse" type="button">Choose file...</button>
    </div>

    <div class="footer">
      <button class="primary" id="confirm" type="button">Continue</button>
    </div>
  </div>
</div>

<script>
  const cards = Array.from(document.querySelectorAll('.card'))
  const radios = Array.from(document.querySelectorAll('input[name=access]'))
  const manualRow = document.getElementById('manual-row')
  const manualPath = document.getElementById('manual-path')
  const browseBtn = document.getElementById('browse')
  const confirmBtn = document.getElementById('confirm')

  function currentMode() {
    const checked = radios.find(r => r.checked)
    return checked ? checked.value : ''
  }

  function refresh() {
    const mode = currentMode()
    cards.forEach(card => {
      const radio = card.querySelector('input[type=radio]')
      card.classList.toggle('selected', radio.checked)
    })
    manualRow.classList.toggle('hidden', mode !== 'manual')
    confirmBtn.disabled = mode === 'manual' && manualPath.value.trim() === ''
  }

  cards.forEach(card => {
    card.addEventListener('click', () => {
      const radio = card.querySelector('input[type=radio]')
      radio.checked = true
      refresh()
    })
  })

  browseBtn.addEventListener('click', async () => {
    const p = await window.claudeOMeter.pickCredentialFile()
    manualPath.value = p
    refresh()
  })

  confirmBtn.addEventListener('click', () => {
    const mode = currentMode()
    const credentialPath = mode === 'manual' ? manualPath.value : ''
    window.claudeOMeter.setAccessMode({ mode, credentialPath })
  })

  // Arrow keys move between radios without a click, so the cards have to
  // follow the radio rather than the other way round.
  radios.forEach(r => r.addEventListener('change', refresh))

  refresh()
</script>
</body>
</html>
